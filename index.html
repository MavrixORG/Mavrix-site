<!DOCTYPE html>
<html lang="fa" dir="rtl" data-lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAVRIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0a0a0c;
    --bg-1:#111114;
    --glass:rgba(255,255,255,.045);
    --glass-brd:rgba(255,255,255,.09);
    --glass-brd-strong:rgba(255,255,255,.16);
    --crimson:#c31432;
    --crimson-2:#e0294a;
    --crimson-glow:rgba(224,41,74,.45);
    --silver:#b9bfc9;
    --silver-dim:#7d838d;
    --text-0:#f4f4f6;
    --text-1:#a9adb5;
    --text-2:#6c7078;
    --radius:18px;
    --radius-sm:12px;
    --ff-fa:'Vazirmatn',sans-serif;
    --ff-num:'Space Grotesk','Vazirmatn',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  button, .btn, a, .row, #langBtn, #chatFab, #adminGate{
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
    outline: none;
  }
  button:focus-visible, .btn:focus-visible{
    outline: 2px solid var(--crimson-2);
    outline-offset: 2px;
  }
  body{
    font-family:var(--ff-fa);
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(195,20,50,.12), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, rgba(120,130,150,.08), transparent 55%),
      var(--bg-0);
    color:var(--text-0);
    min-height:100%;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
  }
  html[data-lang="en"] body, [data-lang="en"] body { font-family:var(--ff-num), 'Vazirmatn', sans-serif; }
  ::selection{ background:var(--crimson); color:#fff; }
  a{color:inherit;}
  button{ font-family:inherit; cursor:pointer; }
  .num{ font-family:var(--ff-num); font-variant-numeric: tabular-nums; }

  .glass{
    background:var(--glass);
    border:1px solid var(--glass-brd);
    border-radius:var(--radius);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
  }

  /* ================= HEADER ================= */
  header{
    position:relative;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px clamp(16px,4vw,40px);
    gap:16px;
  }
  .brand{
    font-family:var(--ff-num);
    font-weight:700;
    font-size:22px;
    letter-spacing:1px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .brand .x{ color:var(--crimson-2); }
  header .side{ display:flex; align-items:center; gap:14px; font-size:13px; color:var(--text-1); flex:1 1 0; }
  header .side .val{ color:var(--text-0); font-weight:600; }
  #langBtn{
    width:34px; height:34px; border-radius:50%; flex:0 0 auto;
    background:var(--glass); border:1px solid var(--glass-brd); color:var(--text-1);
    font-size:11px; font-weight:700; letter-spacing:.5px;
    display:flex; align-items:center; justify-content:center;
  }
  #langBtn:hover{ border-color:var(--glass-brd-strong); color:var(--text-0); }

  /* ================= LAYOUT ================= */
  main{
    width:100%; max-width:1180px; margin:0 auto; padding:8px clamp(14px,4vw,40px) 60px;
    display:grid;
    grid-template-columns: 1fr 300px;
    gap:20px;
    align-items:start;
    flex:1;
  }
  @media (min-height:760px){
    main{ align-content:center; }
  }
  .col-main{ display:flex; flex-direction:column; gap:16px; min-width:0; }
  .col-side{ display:flex; flex-direction:column; gap:16px; }

  /* ---- ended banner ---- */
  #endedBanner{ display:none; padding:22px; text-align:center; border-color:var(--crimson-2); background:rgba(224,41,74,.08); }
  #endedBanner.show{ display:block; }
  #endedBanner .icon{ font-size:30px; margin-bottom:6px; }
  #endedBanner .txt{ font-size:clamp(17px,2.6vw,22px); font-weight:800; color:var(--text-0); }

  /* ---- prize box ---- */
  #prizeBox{ padding:16px 20px; display:none; }
  #prizeBox.show{ display:block; }
  #prizeBox .label{ font-size:11px; color:var(--crimson-2); letter-spacing:1px; font-weight:700; margin-bottom:6px; }
  #prizeBox .items{ display:flex; flex-direction:column; gap:4px; font-size:14px; color:var(--text-0); }
  #prizeBox .items .rank{ color:var(--silver); font-weight:600; }

  /* ---- main box ---- */
  #mainBox{ padding:clamp(20px,4vw,40px); min-height:340px; position:relative; overflow:hidden; transition: all .6s cubic-bezier(.2,.8,.2,1); }

  .stage{ display:none; }
  .stage.active{ display:block; }

  /* pre-registration hero */
  #stageIdle{ text-align:center; padding:20px 0; }
  #stageIdle .cap{ font-size:12px; color:var(--text-2); letter-spacing:1px; margin-bottom:10px; text-transform:uppercase; }
  #stageIdle h1{ font-size:clamp(24px,4vw,34px); font-weight:800; margin-bottom:10px; }
  #stageIdle p{ color:var(--text-1); font-size:14px; margin-bottom:26px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 28px; border-radius:999px; border:none;
    background:linear-gradient(135deg,var(--crimson),var(--crimson-2));
    color:#fff; font-weight:700; font-size:14.5px;
    box-shadow:0 8px 24px var(--crimson-glow);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 12px 30px var(--crimson-glow); }
  .btn:active{ transform:translateY(0); }
  .btn.ghost{
    background:transparent; border:1px solid var(--glass-brd-strong); color:var(--text-0);
    box-shadow:none;
  }
  .btn.ghost:hover{ border-color:var(--silver); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn.small{ padding:9px 16px; font-size:13px; }

  /* registration form */
  #stageForm{ max-width:380px; margin:0 auto; text-align:center; padding:10px 0; }
  #stageForm h2{ font-size:19px; font-weight:700; margin-bottom:18px; }
  .field{ text-align:right; margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--text-2); margin-bottom:6px; }
  .field input{
    width:100%; padding:13px 16px; border-radius:12px;
    background:rgba(255,255,255,.04); border:1px solid var(--glass-brd);
    color:var(--text-0); font-size:15px; font-family:inherit;
    outline:none; transition:border-color .15s;
  }
  .field input:focus{ border-color:var(--crimson-2); }
  #captchaRow{ display:flex; align-items:center; gap:10px; }
  #captchaRow .q{ font-size:14px; color:var(--text-1); white-space:nowrap; }
  #formMsg{ font-size:13px; margin-top:10px; min-height:18px; }
  #formMsg.err{ color:var(--crimson-2); }
  #formMsg.ok{ color:#5fd08a; }

  /* success state */
  #stageDone{ text-align:center; padding:30px 0; }
  #stageDone .tick{ font-size:40px; margin-bottom:14px; }
  #stageDone h2{ font-size:18px; font-weight:700; margin-bottom:6px; }
  #stageDone p{ color:var(--text-1); font-size:13.5px; }

  /* draw stage */
  #stageDraw{ min-height:300px; position:relative; }
  #shuffleField{ position:relative; height:280px; }
  .float-name{
    position:absolute; font-family:var(--ff-num); font-weight:600;
    color:var(--silver); font-size:15px; opacity:0; white-space:nowrap;
    transition: opacity .5s ease, transform .5s ease;
  }
  .float-name.on{ opacity:.85; }
  #countdown{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--ff-num); font-weight:800; font-size:64px; color:var(--text-0);
    text-shadow:0 0 40px var(--crimson-glow);
  }
  #winnerReveal{ display:none; text-align:center; padding:20px 0; }
  #winnerReveal.show{ display:block; }
  #winnerReveal .eyebrow{ font-size:12px; letter-spacing:2px; color:var(--crimson-2); font-weight:700; margin-bottom:12px; }
  #winnerReveal .names{ display:flex; flex-direction:column; gap:14px; }
  #winnerReveal .wname{ font-size:clamp(28px,6vw,46px); font-weight:900; }
  #winnerReveal .wrank{ font-size:12px; color:var(--text-2); margin-bottom:4px; }

  #adminControls{ display:none; margin-top:22px; padding-top:18px; border-top:1px dashed var(--glass-brd); text-align:center; gap:10px; flex-wrap:wrap; justify-content:center; }
  #adminControls.show{ display:flex; }

  /* ---- capacity ---- */
  #capBox{ padding:14px 18px; display:flex; align-items:center; justify-content:space-between; }
  #capBox .lbl{ font-size:12px; color:var(--text-2); }
  #capBox .n{ font-family:var(--ff-num); font-weight:700; font-size:16px; color:var(--text-0); }

  /* ---- names box ---- */
  #namesBox{ padding:16px 18px; max-height:340px; display:flex; flex-direction:column; }
  #namesBox .lbl{ font-size:11px; color:var(--text-2); letter-spacing:1px; margin-bottom:10px; text-transform:uppercase; }
  #namesList{ overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  #namesList .row{ display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text-1); animation:fadeIn .4s ease; }
  #namesList .row .id{ color:var(--crimson-2); font-family:var(--ff-num); font-size:11px; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }
  #namesList::-webkit-scrollbar{ width:4px; }
  #namesList::-webkit-scrollbar-thumb{ background:var(--glass-brd-strong); border-radius:4px; }

  /* ================= CHAT ================= */
  #chatDesktop{
    position:fixed; bottom:20px; left:20px; width:360px; height:460px;
    display:flex; flex-direction:column; overflow:hidden; z-index:40;
  }
  #chatDesktop .head{ padding:12px 16px; border-bottom:1px solid var(--glass-brd); font-size:13px; font-weight:700; }
  #chatMsgs{ flex:1; overflow-y:auto; padding:10px 14px; display:flex; flex-direction:column; gap:8px; }
  #chatMsgs::-webkit-scrollbar{ width:4px; }
  #chatMsgs::-webkit-scrollbar-thumb{ background:var(--glass-brd-strong); border-radius:4px; }
  .msg{ font-size:13px; line-height:1.5; }
  .msg .sender{ font-weight:700; }
  .msg.owner .sender{ color:#ffd76a; }
  .msg.admin .sender{ color:var(--crimson-2); }
  .msg.guest .sender{ color:var(--silver); }
  #chatInputRow{ display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--glass-brd); }
  #chatInputRow input{
    flex:1; background:rgba(255,255,255,.04); border:1px solid var(--glass-brd); border-radius:10px;
    padding:9px 12px; color:var(--text-0); font-size:13px; font-family:inherit; outline:none;
  }
  #chatInputRow input:focus{ border-color:var(--crimson-2); }
  #chatInputRow button{
    width:38px; height:38px; border-radius:10px; border:none; background:var(--crimson); color:#fff; font-size:15px;
  }
  #chatLocked{ padding:14px; text-align:center; font-size:12px; color:var(--text-2); }

  #chatFab{
    display:none; position:fixed; bottom:22px; left:22px; z-index:50;
    width:54px; height:54px; border-radius:50%; border:none;
    background:linear-gradient(135deg,var(--crimson),var(--crimson-2));
    color:#fff; font-size:22px; box-shadow:0 10px 26px var(--crimson-glow);
    align-items:center; justify-content:center;
  }
  #chatSheet{
    display:none; position:fixed; inset:auto 0 0 0; height:75vh; z-index:60;
    background:var(--bg-1); border-top:1px solid var(--glass-brd-strong);
    border-radius:22px 22px 0 0; flex-direction:column; overflow:hidden;
    box-shadow:0 -10px 40px rgba(0,0,0,.5);
  }
  #chatSheet .sheetHead{ padding:14px 18px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--glass-brd); }
  #chatSheet .sheetHead button{ background:none; border:none; color:var(--text-1); font-size:20px; }

  /* confetti */
  #confettiCanvas{ position:fixed; inset:0; pointer-events:none; z-index:80; }

  /* admin request modal */
  .modalWrap{ display:none; position:fixed; inset:0; z-index:90; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); }
  .modalWrap.show{ display:flex; }
  .modalBox{ width:100%; max-width:360px; padding:26px; }
  .modalBox h3{ font-size:16px; font-weight:700; margin-bottom:16px; }
  .modalBox .close{ float:left; background:none; border:none; color:var(--text-2); font-size:18px; }

  #adminGate{
    position:fixed; bottom:20px; right:20px; z-index:30;
    font-size:0; width:44px; height:44px; opacity:0; background:transparent; border:none;
  }

  footer{ text-align:center; padding:18px; font-size:11px; color:var(--text-2); }

  /* ================= RESPONSIVE ================= */
  @media (max-width:860px){
    main{ grid-template-columns:1fr; padding-bottom:120px; }
    header{
      flex-direction:column; align-items:center; gap:8px; text-align:center;
      padding-top:16px;
    }
    header .side{ flex:none; }
    header .side:first-of-type{ order:2; justify-content:center; }
    header .side:last-of-type{ order:3; justify-content:center; }
    .brand{ order:1; font-size:26px; margin-bottom:4px; }
    #langBtn{
      position:absolute; top:14px; left:14px; z-index:5;
    }
    #chatDesktop{ display:none; }
    #chatFab{ display:flex; }
    .col-side{ order:2; }
    #namesBox{ order:2; }
  }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<header>
  <div class="side" style="min-width:0;">
    <span id="dateDisplay" class="val"></span>
  </div>

  <div class="brand" id="brandWrap">
    <img id="brandLogo" src="logo.png" alt="MAVRIX" style="height:34px; display:block;"
         onerror="this.style.display='none'; document.getElementById('brandFallback').style.display='inline';">
    <span id="brandFallback" style="display:none;">MAVRI<span class="x">X</span></span>
  </div>

  <div class="side" style="min-width:0; justify-content:flex-end;">
    <span id="timerDisplay" class="val num">--:--:--</span>
  </div>

  <button id="langBtn" data-fa="EN" data-en="PR">EN</button>
</header>

<main>
  <div class="col-main">
    <div id="endedBanner" class="glass">
      <div class="icon">⏰</div>
      <div class="txt" data-fa="ثبت‌نام به پایان رسید" data-en="Registration has ended">ثبت‌نام به پایان رسید</div>
    </div>

    <div id="prizeBox" class="glass">
      <div class="label" data-fa="جوایز" data-en="PRIZES">جوایز</div>
      <div class="items" id="prizeItems"></div>
    </div>

    <div id="mainBox" class="glass">

      <!-- idle / entry choice -->
      <div id="stageIdle" class="stage active">
        <div class="cap num" id="capInline">-- / --</div>
        <h1 data-fa="قرعه‌کشی MAVRIX" data-en="MAVRIX Raffle">قرعه‌کشی MAVRIX</h1>
        <p data-fa="برای شرکت در قرعه‌کشی ثبت‌نام کن" data-en="Register to join the raffle">برای شرکت در قرعه‌کشی ثبت‌نام کن</p>
        <button class="btn" id="openFormBtn" data-fa="ثبت‌نام" data-en="Register" data-fa-full="ظرفیت پر شده" data-en-full="Capacity full">ثبت‌نام</button>
      </div>

      <!-- registration form -->
      <div id="stageForm" class="stage">
        <h2 data-fa="ثبت‌نام در قرعه‌کشی" data-en="Join the raffle">ثبت‌نام در قرعه‌کشی</h2>
        <div class="field">
          <label data-fa="نام شما" data-en="Your name">نام شما</label>
          <input id="nameInput" maxlength="40" data-fa-ph="نام خود را وارد کنید (فارسی/انگلیسی)" data-en-ph="Enter your name" placeholder="نام خود را وارد کنید (فارسی/انگلیسی)">
        </div>
        <div class="field">
          <label data-fa="یک سؤال ساده" data-en="A quick check">یک سؤال ساده</label>
          <div id="captchaRow">
            <span class="q num" id="captchaQ">? + ? = </span>
            <input id="captchaInput" style="max-width:80px" inputmode="numeric">
          </div>
        </div>
        <button class="btn" id="submitRegBtn" style="width:100%" data-fa="تأیید ثبت‌نام" data-en="Confirm">تأیید ثبت‌نام</button>
        <div id="formMsg"></div>
      </div>

      <!-- success -->
      <div id="stageDone" class="stage">
        <div class="tick">✅</div>
        <h2 data-fa="با موفقیت ثبت‌نام شدی" data-en="You're in!">با موفقیت ثبت‌نام شدی</h2>
        <p data-fa="منتظر شروع قرعه‌کشی بمون" data-en="Hang tight for the draw">منتظر شروع قرعه‌کشی بمون</p>
      </div>

      <!-- draw -->
      <div id="stageDraw" class="stage">
        <div id="shuffleField"></div>
        <div id="winnerReveal">
          <div class="eyebrow" data-fa="برنده" data-en="WINNER">برنده</div>
          <div class="names" id="winnerNames"></div>
        </div>
      </div>

      <div id="adminControls">
        <button class="btn small" id="startDrawBtn" data-fa="شروع قرعه‌کشی" data-en="Start the draw">شروع قرعه‌کشی</button>
        <button class="btn small ghost" id="resetBtn" data-fa="ریست" data-en="Reset">ریست</button>
      </div>
    </div>
  </div>

  <div class="col-side">
    <div id="capBox" class="glass">
      <span class="lbl" data-fa="ظرفیت" data-en="Capacity">ظرفیت</span>
      <span class="n num" id="capNum">0 / 0</span>
    </div>
    <div id="namesBox" class="glass">
      <div class="lbl" data-fa="ثبت‌نامی‌های اخیر" data-en="Recent entries">ثبت‌نامی‌های اخیر</div>
      <div id="namesList"></div>
    </div>
  </div>
</main>

<!-- desktop chat -->
<div id="chatDesktop" class="glass">
  <div class="head" data-fa="چت" data-en="Chat">چت</div>
  <div id="chatMsgs"></div>
  <div id="chatInputRow">
    <input id="chatInput" data-fa-ph="پیامت..." data-en-ph="Message..." placeholder="پیامت...">
    <button id="chatSendBtn">➤</button>
  </div>
  <div id="chatLocked" style="display:none;" data-fa="چت الان بسته است" data-en="Chat is closed right now">چت الان بسته است</div>
</div>

<!-- mobile chat -->
<button id="chatFab">💬</button>
<div id="chatSheet">
  <div class="sheetHead">
    <span data-fa="چت" data-en="Chat">چت</span>
    <button id="chatSheetClose">✕</button>
  </div>
  <div id="chatMsgsM" style="flex:1; overflow-y:auto; padding:10px 16px; display:flex; flex-direction:column; gap:8px;"></div>
  <div id="chatInputRowM" style="display:flex; gap:8px; padding:12px; border-top:1px solid var(--glass-brd);">
    <input id="chatInputM" data-fa-ph="پیامت..." data-en-ph="Message..." placeholder="پیامت..." style="flex:1; background:rgba(255,255,255,.04); border:1px solid var(--glass-brd); border-radius:10px; padding:10px 12px; color:var(--text-0); font-family:inherit;">
    <button id="chatSendBtnM" style="width:40px; border-radius:10px; border:none; background:var(--crimson); color:#fff;">➤</button>
  </div>
</div>

<!-- hidden admin gate -->
<button id="adminGate" aria-hidden="true"></button>

<!-- admin request modal -->
<div class="modalWrap" id="adminModal">
  <div class="modalBox glass">
    <button class="close" id="adminModalClose">✕</button>
    <h3 data-fa="درخواست دسترسی ادمین" data-en="Request admin access">درخواست دسترسی ادمین</h3>
    <div class="field">
      <label data-fa="نام" data-en="Name">نام</label>
      <input id="adminNameInput">
    </div>
    <div class="field">
      <label data-fa="ایمیل" data-en="Email">ایمیل</label>
      <input id="adminEmailInput" type="email">
    </div>
    <button class="btn" id="adminSendLinkBtn" style="width:100%" data-fa="ارسال لینک ورود" data-en="Send sign-in link">ارسال لینک ورود</button>
    <div id="adminModalMsg" style="font-size:12.5px; margin-top:10px; color:var(--text-1);"></div>
  </div>
</div>

<footer>MAVRIX — © <span id="year"></span></footer>

<script type="module">
/* =========================================================
   MAVRIX — index.html
   ⚠️ قبل از استفاده: firebaseConfig پایین رو با مقادیر واقعی
   پروژه‌ی Firebase خودت پر کن (از Project settings > کد Web).
   ========================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, doc, onSnapshot, collection, addDoc, updateDoc,
  query, orderBy, limit, where, getDocs, serverTimestamp, setDoc, getDoc,
  writeBatch

/* ---------------- fingerprint ---------------- */
function getFingerprint(){
  let fp = localStorage.getItem('mavrix_fp');
  if(fp) return fp;
  try{
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'top'; ctx.font = '14px Arial';
    ctx.fillText('mavrix-fp-🎯', 2, 2);
    const raw = [
      navigator.userAgent, navigator.language, screen.width, screen.height,
      screen.colorDepth, new Date().getTimezoneOffset(), c.toDataURL()
    ].join('|');
    let hash = 0;
    for(let i=0;i<raw.length;i++){ hash = (hash*31 + raw.charCodeAt(i)) >>> 0; }
    fp = 'fp_' + hash.toString(36) + '_' + Math.random().toString(36).slice(2,8);
  }catch(e){ fp = 'fp_' + Math.random().toString(36).slice(2,12); }
  localStorage.setItem('mavrix_fp', fp);
  return fp;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// آیدی کوتاه نمایشی: یک عدد + یک حرف انگلیسی (مثل R4 یا 3A)، ثابت برای هر ثبت‌نام
function randomShortId(docId){
  let hash = 0;
  for(let i=0;i<docId.length;i++){ hash = (hash*31 + docId.charCodeAt(i)) >>> 0; }
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const digit = hash % 10;
  const letter = letters[Math.floor(hash / 10) % 26];
  return (hash % 2 === 0) ? `${digit}${letter}` : `${letter}${digit}`;
}

/* ---------------- draw animation ---------------- */
async function runDrawAnimation(winners){
  const field = document.getElementById('shuffleField');
  field.innerHTML = '';
  const snap = await getDocs(collection(db,'registrants'));
  const names = [];
  snap.forEach(d=>{ if(!d.data().blocked) names.push(d.data().name); });
  const slow = names.length <= 12;
  const positions = [];
  function randPos(){
    return { top: Math.random()*80+'%', left: Math.random()*80+'%' };
  }
  let i = 0;
  const interval = setInterval(()=>{
    if(names.length === 0){ clearInterval(interval); startCountdown(); return; }
    const el = document.createElement('div');
    el.className = 'float-name num';
    el.textContent = names[i % names.length];
    const p = randPos();
    el.style.top = p.top; el.style.left = p.left;
    field.appendChild(el);
    requestAnimationFrame(()=>el.classList.add('on'));
    setTimeout(()=>{ el.classList.remove('on'); setTimeout(()=>el.remove(),500); }, slow ? 1400 : 700);
    i++;
    if(i >= names.length * 2){ clearInterval(interval); startCountdown(); }
  }, slow ? 550 : 260);

  function startCountdown(){
    const cd = document.createElement('div');
    cd.id = 'countdown';
    field.appendChild(cd);
    let n = 3;
    cd.textContent = n;
    const cdInt = setInterval(()=>{
      n--;
      if(n<=0){ clearInterval(cdInt); cd.remove(); revealWinners(winners); return; }
      cd.textContent = n;
    }, 900);
  }
}

}

/* ---------------- confetti + sound ---------------- */
function fireConfetti(){
  const canvas = document.getElementById('confettiCanvas');
  canvas.width = innerWidth; canvas.height = innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#c31432','#e0294a','#b9bfc9','#ffffff'];
  const parts = Array.from({length:140}, ()=>({
    x: innerWidth/2, y: innerHeight/2,
    vx:(Math.random()-.5)*14, vy:(Math.random()-1.6)*14,
    size: Math.random()*6+3, color: colors[Math.floor(Math.random()*colors.length)],
    rot: Math.random()*360, vr:(Math.random()-.5)*10
  }));
  let frame = 0;
  function anim(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    parts.forEach(p=>{
      p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
      ctx.restore();
    });
    if(frame < 160) requestAnimationFrame(anim); else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  anim();
}
function playWinSound(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f,idx)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + idx*0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.5);
      o.start(t); o.stop(t+0.55);
    });
  }catch(e){}
}

  const snap = await getDocs(collection(db, name));
  const docs = snap.docs;
  // batch حداکثر ۵۰۰ عملیات قبول می‌کنه، پس اگه بیشتر بود تیکه‌تیکه پاک می‌کنیم
  for(let i=0; i<docs.length; i+=450){
    const batch = writeBatch(db);
    docs.slice(i, i+450).forEach(d => batch.delete(d.ref));
    await batch.commit();
  }
}
document.getElementById('resetBtn').addEventListener('click', async ()=>{
  if(!isOwnerUser) return;
  if(!confirm(lang==='fa' ? 'همه‌چیز پاک بشه و دور جدید شروع بشه؟' : 'Clear everything and start a new round?')) return;
  try{
    await clearCollection('registrants');
    await clearCollection('chat');
    await updateDoc(doc(db,'settings','main'), { drawStarted:false, drawEnded:false, winners:[] });
    localStorage.removeItem('mavrix_reg_id'); localStorage.removeItem('mavrix_reg_name');
    window.__drawAnimationStarted = false;
    location.reload();
  }catch(e){ console.error(e); alert(lang==='fa' ? 'خطا در ریست کردن' : 'Failed to reset'); }
});
</script>
