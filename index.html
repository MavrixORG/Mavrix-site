<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MAVRIX — قرعه‌کشی آنلاین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-0:#08080c;
    --bg-1:#0f0f16;
    --glass:rgba(255,255,255,.045);
    --glass-strong:rgba(255,255,255,.08);
    --border:rgba(255,255,255,.10);
    --border-strong:rgba(255,255,255,.18);
    --crimson:#c4123f;
    --crimson-bright:#ff2255;
    --silver:#b9bdc7;
    --steel:#7d8391;
    --text:#f3f3f6;
    --text-dim:#9a9ca6;
    --radius:18px;
    --shadow:0 20px 60px -20px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(196,18,63,.14), transparent 60%),
      radial-gradient(1000px 500px at 100% 10%, rgba(120,130,150,.08), transparent 55%),
      var(--bg-0);
    color:var(--text);
    font-family:'Vazirmatn',sans-serif;
    min-height:100%;
    overflow-x:hidden;
  }
  [dir="ltr"] body{direction:ltr;}
  .glass{
    background:var(--glass);
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* ================= LAYOUT SHELL ================= */
  .app{
    max-width:1180px;
    margin:0 auto;
    padding:20px 20px 100px;
    display:flex;
    flex-direction:column;
    gap:16px;
    position:relative;
    z-index:1;
  }

  /* ================= HEADER (desktop 3-part) ================= */
  header.top{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:16px 26px;
    position:relative;
  }
  .head-date{
    font-size:.85rem;
    color:var(--text-dim);
    letter-spacing:.02em;
    justify-self:start;
  }
  .head-name{
    justify-self:center;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo-img{
    height:34px;
    width:auto;
    display:block;
    filter:drop-shadow(0 4px 16px rgba(196,18,63,.35));
  }
  .logo-img-mobile{
    height:48px;
  }
  .head-right{
    justify-self:end;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .timer{
    font-variant-numeric:tabular-nums;
    font-weight:700;
    font-size:1.05rem;
    padding:8px 14px;
    border-radius:12px;
    background:var(--glass-strong);
    border:1px solid var(--border);
    letter-spacing:.03em;
  }
  .timer.urgent{color:var(--crimson-bright); border-color:rgba(196,18,63,.5);}
  .lang-switch{
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    background:var(--glass-strong);
    border:1px solid var(--border);
    font-size:.72rem;
    font-weight:700;
    position:relative;
  }
  .lang-switch .globe{position:absolute;font-size:1.1rem;opacity:.35;}
  .lang-switch .label{position:relative;z-index:1;}

  /* mobile-only header block */
  .mobile-head{display:none;}

  /* ================= PRIZE BOX ================= */
  .prize-box{
    padding:16px 22px;
    display:flex;
    align-items:center;
    gap:14px;
    justify-content:center;
    text-align:center;
    border-color:rgba(196,18,63,.28);
  }
  .prize-box.hidden{display:none;}
  .prize-icon{font-size:1.3rem;}
  .prize-text{font-size:.95rem;color:var(--silver);}
  .prize-text b{color:var(--text);font-weight:700;}

  /* ================= MAIN ROW (main box + names box) ================= */
  .main-row{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:16px;
    align-items:start;
    transition:grid-template-columns .6s cubic-bezier(.65,0,.35,1);
  }
  .main-row.drawing{
    grid-template-columns:1fr 0px;
  }
  .main-row.drawing .names-box{
    opacity:0;
    pointer-events:none;
    transform:scale(.96);
  }

  .main-box{
    position:relative;
    min-height:420px;
    padding:34px 30px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    transition:min-height .6s cubic-bezier(.65,0,.35,1);
  }
  .main-row.drawing .main-box{min-height:520px;}

  .capacity-pill{
    position:absolute;
    top:16px;
    inset-inline-end:18px;
    font-variant-numeric:tabular-nums;
    font-weight:800;
    font-size:1rem;
    padding:6px 14px;
    border-radius:20px;
    background:var(--glass-strong);
    border:1px solid var(--border);
    color:var(--silver);
  }

  /* --- registration stage --- */
  .stage{width:100%;max-width:380px;display:none;flex-direction:column;align-items:center;gap:18px;text-align:center;}
  .stage.active{display:flex;}
  .stage h2{font-size:1.3rem;font-weight:800;}
  .stage p.sub{color:var(--text-dim);font-size:.9rem;line-height:1.7;}

  .reg-form{width:100%;display:flex;flex-direction:column;gap:12px;}
  .reg-input{
    width:100%;
    padding:14px 18px;
    border-radius:14px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--border);
    color:var(--text);
    font-size:1rem;
    outline:none;
    transition:border-color .2s, background .2s;
    text-align:center;
  }
  .reg-input:focus{border-color:var(--crimson);background:rgba(255,255,255,.06);}
  .reg-btn{
    padding:14px 18px;
    border-radius:14px;
    font-weight:800;
    font-size:1rem;
    background:linear-gradient(135deg,var(--crimson),var(--crimson-bright));
    color:#fff;
    box-shadow:0 10px 30px -10px rgba(196,18,63,.6);
    transition:transform .15s, box-shadow .15s;
  }
  .reg-btn:active{transform:scale(.98);}
  .reg-btn:disabled{opacity:.5;cursor:not-allowed;}
  .reg-error{color:var(--crimson-bright);font-size:.85rem;min-height:1.2em;}
  .reg-success{
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .reg-success .check{
    width:56px;height:56px;border-radius:50%;
    background:rgba(196,18,63,.14);
    border:1px solid rgba(196,18,63,.4);
    display:flex;align-items:center;justify-content:center;
    font-size:1.6rem;color:var(--crimson-bright);
  }

  .closed-note{color:var(--text-dim);font-size:.9rem;}

  /* --- drawing stage: floating names --- */
  .draw-stage{
    position:relative;
    width:100%;
    height:100%;
    min-height:420px;
    display:none;
  }
  .draw-stage.active{display:block;}
  .float-name{
    position:absolute;
    font-weight:700;
    font-size:1.15rem;
    color:var(--silver);
    opacity:0;
    white-space:nowrap;
    transition:opacity .5s ease, transform .5s ease;
    text-shadow:0 2px 12px rgba(0,0,0,.5);
  }
  .float-name.show{opacity:1;}

  .countdown-num{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    font-size:5rem;
    font-weight:900;
    color:var(--crimson-bright);
    text-shadow:0 0 40px rgba(255,34,85,.6);
    opacity:0;
    transition:opacity .25s, transform .25s;
  }
  .countdown-num.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

  .winner-reveal{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    opacity:0;
    transform:scale(.85);
    transition:opacity .5s ease, transform .5s cubic-bezier(.34,1.56,.64,1);
    pointer-events:none;
  }
  .winner-reveal.show{opacity:1;transform:scale(1);pointer-events:auto;}
  .winner-reveal .rank{color:var(--crimson-bright);font-weight:700;font-size:1rem;letter-spacing:.05em;}
  .winner-reveal .name{
    font-size:2.6rem;
    font-weight:900;
    background:linear-gradient(90deg,#fff,var(--crimson-bright));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .winner-reveal .prize{color:var(--silver);font-size:.95rem;}

  canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;}

  /* ================= NAMES BOX ================= */
  .names-box{
    padding:20px;
    min-height:420px;
    max-height:520px;
    overflow-y:auto;
    transition:opacity .4s, transform .4s;
  }
  .names-box h3{font-size:.95rem;color:var(--text-dim);margin-bottom:14px;font-weight:700;}
  .names-list{display:flex;flex-direction:column;gap:8px;}
  .names-list .item{
    padding:9px 12px;
    border-radius:10px;
    background:rgba(255,255,255,.03);
    border:1px solid var(--border);
    font-size:.88rem;
    color:var(--silver);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .names-list .item .dot{width:6px;height:6px;border-radius:50%;background:var(--crimson);flex-shrink:0;}
  .names-empty{color:var(--text-dim);font-size:.85rem;text-align:center;padding:20px 0;}

  /* ================= CHAT — desktop fixed bottom-left ================= */
  .chat-panel{
    position:fixed;
    bottom:20px;
    inset-inline-start:20px;
    width:320px;
    height:400px;
    display:flex;
    flex-direction:column;
    z-index:40;
    transition:opacity .4s, transform .4s;
  }
  .chat-panel.faded{opacity:0;pointer-events:none;transform:translateY(10px);}
  .chat-head{
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    font-weight:700;
    font-size:.85rem;
    color:var(--text-dim);
    display:flex;justify-content:space-between;align-items:center;
  }
  .chat-messages{
    flex:1;
    overflow-y:auto;
    padding:12px 16px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .chat-msg{font-size:.85rem;line-height:1.5;}
  .chat-msg .sender{color:var(--crimson-bright);font-weight:700;}
  .chat-msg .text{color:var(--text);word-break:break-word;}
  .chat-input-row{
    padding:10px 12px;
    border-top:1px solid var(--border);
    display:flex;
    gap:8px;
  }
  .chat-input{
    flex:1;
    padding:9px 12px;
    border-radius:10px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--border);
    color:var(--text);
    font-size:.85rem;
    outline:none;
  }
  .chat-send{
    padding:9px 14px;
    border-radius:10px;
    background:var(--crimson);
    color:#fff;
    font-weight:700;
    font-size:.85rem;
  }
  .chat-send:disabled{opacity:.4;cursor:not-allowed;}
  .chat-hint{font-size:.72rem;color:var(--text-dim);padding:0 12px 10px;}

  /* mobile floating chat button */
  .chat-fab{
    display:none;
    position:fixed;
    bottom:20px;
    inset-inline-end:20px;
    width:56px;height:56px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--crimson),var(--crimson-bright));
    box-shadow:0 10px 30px -8px rgba(196,18,63,.7);
    align-items:center;justify-content:center;
    font-size:1.4rem;
    z-index:45;
  }
  .chat-sheet-backdrop{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.5);
    z-index:60;
    opacity:0;
    transition:opacity .3s;
  }
  .chat-sheet-backdrop.open{display:block;opacity:1;}
  .chat-sheet{
    position:fixed;
    left:0;right:0;bottom:0;
    height:75vh;
    border-radius:22px 22px 0 0;
    transform:translateY(100%);
    transition:transform .35s cubic-bezier(.32,.72,0,1);
    z-index:61;
    display:flex;
    flex-direction:column;
  }
  .chat-sheet.open{transform:translateY(0);}

  /* ================= FOOTER credit ================= */
  footer.credit{
    text-align:center;
    color:var(--text-dim);
    font-size:.72rem;
    padding:20px 0 0;
    letter-spacing:.04em;
  }

  /* ================= RESPONSIVE ================= */
  @media (max-width:820px){
    header.top{display:none;}
    .mobile-head{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      padding:22px 20px;
    }
    .mobile-row2{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .main-row{grid-template-columns:1fr;}
    .main-row.drawing{grid-template-columns:1fr;}
    .names-box{order:2;min-height:0;max-height:280px;}
    .main-box{order:1;min-height:380px;}

    .chat-panel{display:none;}
    .chat-fab{display:flex;}
  }
</style>
</head>
<body>

<canvas class="confetti" id="confettiCanvas"></canvas>

<div class="app" id="app">

  <!-- ============ DESKTOP HEADER ============ -->
  <header class="top glass">
    <div class="head-date" id="headDate">—</div>
    <div class="head-name"><img src="logo.png" alt="MAVRIX" class="logo-img"></div>
    <div class="head-right">
      <div class="timer" id="timerDisplay">--:--:--</div>
      <button class="lang-switch" id="langSwitchDesktop" aria-label="switch language">
        <span class="globe">🌐</span><span class="label" id="langLabelDesktop">EN</span>
      </button>
    </div>
  </header>

  <!-- ============ MOBILE HEADER ============ -->
  <div class="mobile-head glass">
    <div class="head-name"><img src="logo.png" alt="MAVRIX" class="logo-img logo-img-mobile"></div>
    <div class="mobile-row2">
      <div class="head-date" id="headDateMobile">—</div>
      <div class="timer" id="timerDisplayMobile">--:--:--</div>
      <button class="lang-switch" id="langSwitchMobile" aria-label="switch language">
        <span class="globe">🌐</span><span class="label" id="langLabelMobile">EN</span>
      </button>
    </div>
  </div>

  <!-- ============ PRIZE BOX ============ -->
  <div class="prize-box glass hidden" id="prizeBox">
    <span class="prize-icon">🏆</span>
    <span class="prize-text" id="prizeText"></span>
  </div>

  <!-- ============ MAIN ROW ============ -->
  <div class="main-row" id="mainRow">

    <div class="main-box glass" id="mainBox">
      <div class="capacity-pill" id="capacityPill">0/0</div>

      <!-- Stage 1: registration form -->
      <div class="stage active" id="stageForm">
        <h2 id="txtRegTitle">ثبت‌نام در قرعه‌کشی</h2>
        <p class="sub" id="txtRegSub">فقط با نام خودت ثبت‌نام کن و منتظر شروع قرعه‌کشی باش.</p>
        <form class="reg-form" id="regForm">
          <input class="reg-input" id="nameInput" type="text" placeholder="نام شما" maxlength="40" required>
          <button class="reg-btn" type="submit" id="regBtn">ثبت‌نام</button>
          <div class="reg-error" id="regError"></div>
        </form>
      </div>

      <!-- Stage 2: already registered -->
      <div class="stage" id="stageRegistered">
        <div class="reg-success">
          <div class="check">✓</div>
          <h2 id="txtRegisteredTitle">ثبت‌نامت انجام شد!</h2>
          <p class="sub" id="registeredName"></p>
          <p class="sub" id="txtWaitMsg">منتظر شروع قرعه‌کشی باش</p>
        </div>
      </div>

      <!-- Stage 3: registration closed -->
      <div class="stage" id="stageClosed">
        <h2 id="txtClosedTitle">ثبت‌نام بسته شده</h2>
        <p class="closed-note" id="txtClosedSub">منتظر شروع قرعه‌کشی توسط مالک باش.</p>
      </div>

      <!-- Stage 4: drawing animation -->
      <div class="draw-stage" id="drawStage">
        <div class="countdown-num" id="countdownNum"></div>
        <div class="winner-reveal" id="winnerReveal">
          <div class="rank" id="winnerRank">برنده</div>
          <div class="name" id="winnerName"></div>
          <div class="prize" id="winnerPrize"></div>
        </div>
      </div>

      <!-- Stage 5: draw ended, all winners -->
      <div class="stage" id="stageEnded">
        <h2 id="txtEndedTitle">🎉 قرعه‌کشی به پایان رسید</h2>
        <div id="allWinnersList" style="display:flex;flex-direction:column;gap:8px;width:100%;"></div>
      </div>
    </div>

    <div class="names-box glass" id="namesBox">
      <h3 id="txtNamesTitle">ثبت‌نامی‌ها</h3>
      <div class="names-list" id="namesList"></div>
    </div>

  </div>

  <footer class="credit">MAVRIX © <span id="yearNow"></span></footer>
</div>

<!-- ============ CHAT: desktop fixed panel ============ -->
<div class="chat-panel glass" id="chatPanel">
  <div class="chat-head">
    <span id="txtChatTitle">گفتگو</span>
    <span id="slowModeTag" style="font-size:.7rem;"></span>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-row">
    <input class="chat-input" id="chatInput" placeholder="پیام..." maxlength="300">
    <button class="chat-send" id="chatSend">ارسال</button>
  </div>
  <div class="chat-hint" id="chatHint"></div>
</div>

<!-- ============ CHAT: mobile FAB + sheet ============ -->
<button class="chat-fab" id="chatFab">💬</button>
<div class="chat-sheet-backdrop" id="chatBackdrop"></div>
<div class="chat-sheet glass" id="chatSheet">
  <div class="chat-head">
    <span id="txtChatTitleMobile">گفتگو</span>
    <button id="chatCloseBtn" style="font-size:1.1rem;">✕</button>
  </div>
  <div class="chat-messages" id="chatMessagesMobile"></div>
  <div class="chat-input-row">
    <input class="chat-input" id="chatInputMobile" placeholder="پیام..." maxlength="300">
    <button class="chat-send" id="chatSendMobile">ارسال</button>
  </div>
  <div class="chat-hint" id="chatHintMobile"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, getDoc, getDocs, setDoc,
  query, where, orderBy, limit, onSnapshot, serverTimestamp, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ---------------- Firebase init ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyDXUGqlKv-WvDUt-eB5LfZ8y_HCYlaxzXQ",
  authDomain: "mavrix-57861.firebaseapp.com",
  projectId: "mavrix-57861",
  storageBucket: "mavrix-57861.firebasestorage.app",
  messagingSenderId: "38679970456",
  appId: "1:38679970456:web:4cb2d44a02134d239d46ed"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ---------------- i18n ---------------- */
const DICT = {
  fa: {
    regTitle:"ثبت‌نام در قرعه‌کشی",
    regSub:"فقط با نام خودت ثبت‌نام کن و منتظر شروع قرعه‌کشی باش.",
    namePh:"نام شما",
    regBtn:"ثبت‌نام",
    registeredTitle:"ثبت‌نامت انجام شد!",
    waitMsg:"منتظر شروع قرعه‌کشی باش",
    closedTitle:"ثبت‌نام بسته شده",
    closedSub:"منتظر شروع قرعه‌کشی توسط مالک باش.",
    namesTitle:"ثبت‌نامی‌ها",
    chatTitle:"گفتگو",
    chatPh:"پیام...",
    sendBtn:"ارسال",
    endedTitle:"🎉 قرعه‌کشی به پایان رسید",
    winnerLabel:"برنده",
    dupName:"این نام قبلاً ثبت شده، یه نام دیگه امتحان کن.",
    dupFP:"شما قبلاً ثبت‌نام کرده‌اید.",
    emptyName:"لطفاً نامت رو وارد کن.",
    full:"ظرفیت تکمیل شده.",
    closedErr:"ثبت‌نام بسته است.",
    chatNeedsReg:"برای نوشتن پیام باید ثبت‌نام کرده باشی.",
    chatBlocked:"دسترسی چت شما مسدود شده است.",
    slowWait:"لطفاً ⌛ ثانیه صبر کن",
    namesEmpty:"هنوز کسی ثبت‌نام نکرده",
    langTarget:"EN"
  },
  en: {
    regTitle:"Register for the draw",
    regSub:"Enter just your name and wait for the draw to begin.",
    namePh:"Your name",
    regBtn:"Register",
    registeredTitle:"You're registered!",
    waitMsg:"Wait for the draw to start",
    closedTitle:"Registration closed",
    closedSub:"Waiting for the owner to start the draw.",
    namesTitle:"Registrants",
    chatTitle:"Chat",
    chatPh:"Message...",
    sendBtn:"Send",
    endedTitle:"🎉 The draw has ended",
    winnerLabel:"Winner",
    dupName:"That name is already taken, try another.",
    dupFP:"You have already registered.",
    emptyName:"Please enter your name.",
    full:"Capacity is full.",
    closedErr:"Registration is closed.",
    chatNeedsReg:"You must register to send messages.",
    chatBlocked:"Your chat access is blocked.",
    slowWait:"Please wait ⌛s",
    namesEmpty:"No one has registered yet",
    langTarget:"PR"
  }
};
let lang = localStorage.getItem('mavrix_lang') || 'fa';

function applyLang(){
  const d = DICT[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
  document.getElementById('txtRegTitle').textContent = d.regTitle;

/* ---------------- fingerprint (lightweight, no external lib) ---------------- */
function getFingerprint(){
  let fp = localStorage.getItem('mavrix_fp');
  if(fp) return fp;
  try{
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = "14px 'Vazirmatn'";
    ctx.fillText('mavrix-fp-🔥', 2, 2);
    const raw = [
      navigator.userAgent, navigator.language, screen.width, screen.height,
      screen.colorDepth, new Date().getTimezoneOffset(), canvas.toDataURL()
    ].join('###');
    let hash = 0;
    for(let i=0;i<raw.length;i++){ hash = (hash*31 + raw.charCodeAt(i)) | 0; }
    fp = 'fp_' + Math.abs(hash).toString(36) + '_' + Math.random().toString(36).slice(2,8);
  }catch(e){
    fp = 'fp_' + Math.random().toString(36).slice(2,10);
  }
  localStorage.setItem('mavrix_fp', fp);
  return fp;
}
const myFingerprint = getFingerprint();
let myRegisteredName = localStorage.getItem('mavrix_myname') || null;

/* ---------------- state ---------------- */
let settings = {};
let registrants = [];
let unsubSettings = null, unsubRegistrants = null, unsubChat = null;

document.getElementById('yearNow').textContent = new Date().getFullYear();

/* ---------------- date + timer ---------------- */
function updateDateDisplay(){
  const now = new Date();
  const fmt = lang === 'fa'
    ? new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'long',day:'numeric'}).format(now)
    : new Intl.DateTimeFormat('en-US',{year:'numeric',month:'short',day:'numeric'}).format(now);
  document.getElementById('headDate').textContent = fmt;
  document.getElementById('headDateMobile').textContent = fmt;
}
updateDateDisplay();
setInterval(updateDateDisplay, 60000);

function tickTimer(){
  const el1 = document.getElementById('timerDisplay');
  const el2 = document.getElementById('timerDisplayMobile');
  if(!settings.timerEndsAt){ el1.textContent='--:--:--'; el2.textContent='--:--:--'; return; }
  const end = settings.timerEndsAt.toDate ? settings.timerEndsAt.toDate() : new Date(settings.timerEndsAt);
  const diff = end - new Date();
  if(diff <= 0){
    el1.textContent = '00:00:00'; el2.textContent='00:00:00';
    el1.classList.add('urgent'); el2.classList.add('urgent');
    maybeAutoCloseRegistration();
    return;
  }
  const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
  const str = [h,m,s].map(v=>String(v).padStart(2,'0')).join(':');
  el1.textContent = str; el2.textContent = str;
  if(diff < 60000){ el1.classList.add('urgent'); el2.classList.add('urgent'); }
  else { el1.classList.remove('urgent'); el2.classList.remove('urgent'); }
}
setInterval(tickTimer, 1000);

let autoCloseAttempted = false;
async function maybeAutoCloseRegistration(){
  if(autoCloseAttempted) return;
  if(settings.registrationOpen && !settings.drawStarted){
    autoCloseAttempted = true;
    try{
      await setDoc(doc(db,'settings','main'), { registrationOpen:false }, { merge:true });
    }catch(e){ /* rules likely block public write; owner dashboard will close it */ }
  }
}

/* ---------------- settings listener ---------------- */
unsubSettings = onSnapshot(doc(db,'settings','main'), (snap)=>{
  if(!snap.exists()) return;
  settings = snap.data();
  renderCapacity();
  renderPrize();
  renderStage();
});

/* ---------------- registrants listener ---------------- */
unsubRegistrants = onSnapshot(collection(db,'registrants'), (snap)=>{
  registrants = [];
  snap.forEach(d=> registrants.push({id:d.id, ...d.data()}));
  renderCapacity();
  renderNamesList();
  checkIfBlocked();
});

function renderCapacity(){
  const cap = settings.capacity ?? 0;
  document.getElementById('capacityPill').textContent = `${registrants.length}/${cap}`;
}

function renderPrize(){
  const box = document.getElementById('prizeBox');
  if(settings.showPrizesBeforeDraw && settings.prizes && settings.prizes.length){
    box.classList.remove('hidden');
    const txt = settings.prizes.map(p=>`<b>${p.rank}</b>: ${p.text}`).join(' &nbsp;•&nbsp; ');
    document.getElementById('prizeText').innerHTML = txt;
  } else {
    box.classList.add('hidden');
  }
}

function renderNamesList(){
  const list = document.getElementById('namesList');
  if(!registrants.length){
    list.innerHTML = `<div class="names-empty">${DICT[lang].namesEmpty}</div>`;
    return;
  }
  list.innerHTML = registrants
    .filter(r=>!r.blocked)
    .map(r=>`<div class="item"><span class="dot"></span>${escapeHtml(r.name)}</div>`)
    .join('');
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- stage switching ---------------- */
function showStage(id){
  document.querySelectorAll('.stage').forEach(s=>s.classList.remove('active'));
  const el = document.getElementById(id);
  if(el) el.classList.add('active');
}

let lastDrawStarted = false;
function renderStage(){
  const mainRow = document.getElementById('mainRow');
  const drawStage = document.getElementById('drawStage');

  if(settings.drawStarted && !settings.drawEnded){
    mainRow.classList.add('drawing');
    document.getElementById('chatPanel').classList.add('faded');
    document.querySelectorAll('.stage').forEach(s=>s.classList.remove('active'));
    drawStage.classList.add('active');
    if(!lastDrawStarted){ startDrawAnimation(); }
    lastDrawStarted = true;
    return;
  }
  lastDrawStarted = false;
  mainRow.classList.remove('drawing');
  document.getElementById('chatPanel').classList.remove('faded');
  drawStage.classList.remove('active');

  if(settings.drawEnded){
    renderEndedStage();
    showStage('stageEnded');
    return;
  }

  const already = myRegisteredName && registrants.some(r=>r.fingerprint===myFingerprint);
  if(already){
    document.getElementById('registeredName').textContent = myRegisteredName;
    showStage('stageRegistered');
  } else if(!settings.registrationOpen){
    showStage('stageClosed');
  } else {
    showStage('stageForm');
  }
}

function renderEndedStage(){
  const el = document.getElementById('allWinnersList');
  if(!settings.winners || !settings.winners.length){ el.innerHTML=''; return; }
  el.innerHTML = settings.winners.map(w=>`
    <div class="item" style="justify-content:space-between;">
      <span>${DICT[lang].winnerLabel} ${escapeHtml(w.rank)}</span>
      <b>${escapeHtml(w.name)}</b>
    </div>`).join('');
}

/* ---------------- registration form ---------------- */
document.getElementById('regForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const d = DICT[lang];
  const btn = document.getElementById('regBtn');
  const errEl = document.getElementById('regError');
  errEl.textContent = '';
  const name = document.getElementById('nameInput').value.trim();
  if(!name){ errEl.textContent = d.emptyName; return; }
  if(!settings.registrationOpen){ errEl.textContent = d.closedErr; return; }
  if(settings.capacity && registrants.length >= settings.capacity){ errEl.textContent = d.full; return; }
  if(registrants.some(r=>r.fingerprint === myFingerprint)){ errEl.textContent = d.dupFP; return; }
  if(registrants.some(r=>r.name.toLowerCase() === name.toLowerCase())){ errEl.textContent = d.dupName; return; }

  btn.disabled = true;
  try{
    await addDoc(collection(db,'registrants'), {
      name, fingerprint: myFingerprint, registeredAt: serverTimestamp(), blocked:false
    });
    myRegisteredName = name;
    localStorage.setItem('mavrix_myname', name);
  }catch(err){
    errEl.textContent = (lang==='fa' ? 'خطا در ثبت‌نام، دوباره تلاش کن.' : 'Registration failed, try again.');
  }
  btn.disabled = false;
});

function checkIfBlocked(){
  const mine = registrants.find(r=>r.fingerprint===myFingerprint);
  if(mine && mine.blocked){
    // blocked users are treated as not registered for chat purposes; form stays hidden since registrant doc exists
  }
}

/* ---------------- draw animation ---------------- */
let drawAnimHandle = null;
function startDrawAnimation(){
  const stage = document.getElementById('drawStage');
  document.querySelectorAll('.float-name').forEach(n=>n.remove());
  document.getElementById('countdownNum').classList.remove('show');
  document.getElementById('winnerReveal').classList.remove('show');

  const names = registrants.filter(r=>!r.blocked).map(r=>r.name);
  if(!names.length) return;

  const slow = names.length <= 10;
  const interval = slow ? 700 : 350;
  let queue = shuffle([...names]);
  let qi = 0;

  clearInterval(drawAnimHandle);
  drawAnimHandle = setInterval(()=>{
    if(settings.drawEnded){ clearInterval(drawAnimHandle); return; }
    if(qi >= queue.length){ queue = shuffle([...names]); qi = 0; }
    const nm = queue[qi++];
    spawnFloatName(nm, stage);
  }, interval);
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function spawnFloatName(name, stage){
  const el = document.createElement('div');
  el.className = 'float-name';
  el.textContent = name;
  const w = stage.clientWidth || 400, h = stage.clientHeight || 400;
  const x = Math.random()*(w-120)+10;
  const y = Math.random()*(h-40)+10;
  el.style.left = x+'px';
  el.style.top = y+'px';
  stage.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=> el.remove(), 500);
  }, 1200);
}

/* watch for winners appearing (owner triggers via dashboard: sets settings.winners + drawEnded) */
let winnerRevealShown = false;
const origRenderStage = renderStage;
</script>

<!-- second module: chat + sounds + mobile sheet + winner reveal trigger -->
<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, onSnapshot, query, orderBy, limit, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = getApps()[0];
const db = getFirestore(app);
const myFingerprint = localStorage.getItem('mavrix_fp');

/* ---------------- sounds (Web Audio API, synthetic) ---------------- */
let audioCtx;
function ac(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function beep(freq=440, dur=0.15, type='sine', gain=0.15, delay=0){
  try{
    const ctx = ac();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.value = gain;
    osc.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime + delay;
    osc.start(t);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    osc.stop(t+dur+0.02);
  }catch(e){}
}
function playCountdownBeep(){ beep(520, 0.12, 'square', 0.12); }
function playWinnerFanfare(){
  [523.25,659.25,783.99,1046.5].forEach((f,i)=> beep(f, 0.35, 'triangle', 0.14, i*0.09));
}

/* ---------------- confetti ---------------- */
const confettiCanvas = document.getElementById('confettiCanvas');
const cctx = confettiCanvas.getContext('2d');
function resizeConfetti(){ confettiCanvas.width = innerWidth; confettiCanvas.height = innerHeight; }
resizeConfetti();
window.addEventListener('resize', resizeConfetti);
let confettiParticles = [];
function launchConfetti(){
  confettiParticles = [];
  const colors = ['#c4123f','#ff2255','#c0c0c8','#ffffff','#7d8391'];
  for(let i=0;i<160;i++){
    confettiParticles.push({
      x: innerWidth/2, y: innerHeight/2,
      vx:(Math.random()-0.5)*14, vy:(Math.random()-1.6)*14,
      size:4+Math.random()*5, color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360, vr:(Math.random()-0.5)*12, life:100
    });
  }
  requestAnimationFrame(animateConfetti);
}
function animateConfetti(){
  cctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
  let alive = false;
  confettiParticles.forEach(p=>{
    if(p.life<=0) return;
    alive = true;
    p.vy += 0.28; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 1.4;
    cctx.save();
    cctx.translate(p.x,p.y);
    cctx.rotate(p.rot*Math.PI/180);
    cctx.fillStyle = p.color;
    cctx.globalAlpha = Math.max(p.life/100, 0);
    cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    cctx.restore();
  });
  if(alive) requestAnimationFrame(animateConfetti);
  else cctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
}

/* ---------------- winner reveal watcher ---------------- */
let prevSettingsSnapshot = null;
onSnapshot(doc(db,'settings','main'), (snap)=>{
  if(!snap.exists()) return;
  const s = snap.data();
  const stage = document.getElementById('drawStage');
  const countdownEl = document.getElementById('countdownNum');
  const revealEl = document.getElementById('winnerReveal');

  if(s.drawEnded && prevSettingsSnapshot && !prevSettingsSnapshot.drawEnded){
    // transition: play countdown then reveal
    runCountdownThenReveal(s);
  } else if(s.drawEnded && !prevSettingsSnapshot){
    // page loaded after draw already ended: show final state directly without animation
  }
  prevSettingsSnapshot = s;
});

function runCountdownThenReveal(s){
  const countdownEl = document.getElementById('countdownNum');
  const revealEl = document.getElementById('winnerReveal');
  let n = 3;
  countdownEl.textContent = n;
  countdownEl.classList.add('show');
  playCountdownBeep();
  const iv = setInterval(()=>{
    n -= 1;
    if(n>0){
      countdownEl.textContent = n;
      countdownEl.classList.remove('show');
      void countdownEl.offsetWidth;
      countdownEl.classList.add('show');
      playCountdownBeep();
    } else {
      clearInterval(iv);
      countdownEl.classList.remove('show');
      const winners = s.winners || [];
      const w = winners[0];
      if(w){
        document.getElementById('winnerName').textContent = w.name;
        document.getElementById('winnerPrize').textContent = w.text || '';
      }
      revealEl.classList.add('show');
      playWinnerFanfare();
      launchConfetti();
    }
  }, 900);
}

/* ---------------- chat ---------------- */
let registrantsCache = [];
onSnapshot(collection(db,'registrants'), (snap)=>{
  registrantsCache = [];
  snap.forEach(d=> registrantsCache.push({id:d.id, ...d.data()}));
});

let lastMsgTime = parseInt(localStorage.getItem('mavrix_last_msg')||'0', 10);

function renderChatMessages(msgs){
  const html = msgs.map(m=>`<div class="chat-msg"><span class="sender">${escHtml(m.senderName)}:</span> <span class="text">${escHtml(m.text)}</span></div>`).join('');
  const c1 = document.getElementById('chatMessages');
  const c2 = document.getElementById('chatMessagesMobile');
  c1.innerHTML = html; c1.scrollTop = c1.scrollHeight;
  c2.innerHTML = html; c2.scrollTop = c2.scrollHeight;
}
function escHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const chatQ = query(collection(db,'chat'), orderBy('sentAt','asc'), limit(200));
onSnapshot(chatQ, (snap)=>{
  const msgs = [];
  snap.forEach(d=> msgs.push(d.data()));
  renderChatMessages(msgs);
});

async function sendChat(inputEl, hintEl){
  const text = inputEl.value.trim();
  if(!text) return;
  const mine = registrantsCache.find(r=>r.fingerprint===myFingerprint);
  if(!mine){ hintEl.textContent = (document.documentElement.lang==='fa' ? 'برای نوشتن پیام باید ثبت‌نام کرده باشی.' : 'You must register to send messages.'); return; }
  if(mine.blocked){ hintEl.textContent = (document.documentElement.lang==='fa' ? 'دسترسی چت شما مسدود شده است.' : 'Your chat access is blocked.'); return; }

  const settingsSnap = await new Promise((resolve)=>{
    const unsub = onSnapshot(doc(db,'settings','main'), (s)=>{ unsub(); resolve(s.data()||{}); });
  });
  const slowSec = settingsSnap.slowModeSeconds || 0;
  const now = Date.now();
  if(slowSec > 0 && (now - lastMsgTime) < slowSec*1000){
    const wait = Math.ceil((slowSec*1000 - (now-lastMsgTime))/1000);
    hintEl.textContent = (document.documentElement.lang==='fa' ? `لطفاً ${wait} ثانیه صبر کن` : `Please wait ${wait}s`);
    return;
  }

  try{
    await addDoc(collection(db,'chat'), {
      senderName: mine.name, fingerprint: myFingerprint, text: text.slice(0,300), sentAt: serverTimestamp()
    });
    inputEl.value = '';
    hintEl.textContent = '';
    lastMsgTime = now;
    localStorage.setItem('mavrix_last_msg', String(now));
  }catch(e){
    hintEl.textContent = (document.documentElement.lang==='fa' ? 'ارسال پیام ناموفق بود.' : 'Failed to send message.');
  }
}

document.getElementById('chatSend').addEventListener('click', ()=> sendChat(document.getElementById('chatInput'), document.getElementById('chatHint')));
document.getElementById('chatInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendChat(document.getElementById('chatInput'), document.getElementById('chatHint')); });
document.getElementById('chatSendMobile').addEventListener('click', ()=> sendChat(document.getElementById('chatInputMobile'), document.getElementById('chatHintMobile')));
document.getElementById('chatInputMobile').addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendChat(document.getElementById('chatInputMobile'), document.getElementById('chatHintMobile')); });

/* ---------------- mobile sheet open/close ---------------- */
const fab = document.getElementById('chatFab');
const sheet = document.getElementById('chatSheet');
const backdrop = document.getElementById('chatBackdrop');
function openSheet(){ sheet.classList.add('open'); backdrop.classList.add('open'); }
function closeSheet(){ sheet.classList.remove('open'); backdrop.classList.remove('open'); }
fab.addEventListener('click', openSheet);
backdrop.addEventListener('click', closeSheet);
document.getElementById('chatCloseBtn').addEventListener('click', closeSheet);
</script>
